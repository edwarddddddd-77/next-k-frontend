<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next K · Clawby Quant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="api-base.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                        sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-light': 'var(--surface-light)',
                        border: 'var(--border)',
                        accent: 'var(--accent)',
                        gold: 'var(--gold)',
                        'neon-green': 'var(--neon-green)',
                        'neon-red': 'var(--neon-red)',
                        'neon-blue': 'var(--neon-blue)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                    },
                },
            },
        };
    </script>
    <style>
        .metric-chip {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.2rem 0.55rem; border-radius: var(--radius-sm);
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            background: color-mix(in srgb, var(--surface-light) 40%, transparent);
            font-size: 0.6875rem; color: var(--text-secondary);
        }
        #clawby-frame {
            width: 100%;
            height: calc(100vh - 7.5rem);
            min-height: 480px;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface);
        }
    </style>
</head>
<body class="min-h-screen">
<header class="app-header sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-2.5">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <div class="flex items-center gap-2.5 shrink-0">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title text-text-primary">Next <span class="text-accent">K</span></h1>
                        <div class="brand-subtitle hidden sm:block">Clawby Quant</div>
                    </div>
                </div>
                <nav class="hidden sm:flex items-center gap-1.5 ml-2">
                    <a class="nav-pill" href="index.html">策略看板</a>
                    <a class="nav-pill" href="alpha.html">Alpha 筹码</a>
                    <a class="nav-pill" href="trading-os.html">Trading OS</a>
                    <a class="nav-pill nav-pill-active" href="clawby-quant.html">Clawby Quant</a>
                    <a class="nav-pill" href="grid.html">Next K 网格</a>
                </nav>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <span id="cq-status" class="metric-chip">检测中…</span>
                <a id="cq-open" href="#" target="_blank" rel="noopener" class="metric-chip hover:border-gold/40">新窗口打开</a>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-4">
    <p class="text-sm text-text-secondary mb-3">
        集成 <a class="text-neon-blue underline" href="https://github.com/openclawby/clawby-quant" target="_blank" rel="noopener">openclawby/clawby-quant</a>
        ：因子驱动永续合约量化（默认模拟盘）。经
        <strong>Next-k-protocol</strong> 代理
        <code class="text-xs">/api/clawby-quant/*</code>；控制台经
        <code class="text-xs">/clawby-ui/</code>（与网格同属 Protocol）。
    </p>
    <div id="cq-hint" class="text-xs text-neon-red mb-2 hidden"></div>
    <iframe id="clawby-frame" title="Clawby Quant Dashboard"></iframe>
</main>

<script>
const PROTOCOL_BASE = (typeof resolveProtocolBase === 'function'
    ? resolveProtocolBase() : 'http://127.0.0.1:8001').replace(/\/$/, '');
const UI = `${PROTOCOL_BASE}/clawby-ui/`;
const frame = document.getElementById('clawby-frame');
const statusEl = document.getElementById('cq-status');
const hint = document.getElementById('cq-hint');
document.getElementById('cq-open').href = UI;
frame.src = UI;

async function ping() {
    try {
        const r = await fetch(`${PROTOCOL_BASE}/api/clawby-quant/health`, { signal: AbortSignal.timeout(8000) });
        const d = await r.json();
        const up = !!(d.upstream && d.upstream.ok);
        const run = !!(d.runtime && d.runtime.running);
        const embed = d.runtime ? d.runtime.embed_enabled !== false : true;
        statusEl.textContent = up
            ? (run ? 'sidecar 运行中' : '上游已连通')
            : (run ? 'sidecar 启动中…' : (embed ? '未连通' : 'embed 关闭'));
        statusEl.style.color = up ? 'var(--neon-green)' : 'var(--neon-red)';
        if (!up) {
            hint.classList.remove('hidden');
            if (!embed) {
                hint.textContent = 'Clawby embed 被关闭（NEXT_K_CLAWBY_EMBED=0）。默认开启；删掉该变量或改回 1 后重启 Protocol。';
            } else {
                const logHint = (d.runtime && d.runtime.log_path) ? ` 日志: ${d.runtime.log_path}` : '';
                hint.textContent = 'Clawby Quant 未就绪：确认 Protocol 已部署最新版并完成启动；配置 CLAWBY_API_KEY；币安可用 BINANCE_API_SECRET（自动映射为 BINANCE_SECRET_KEY）。' + logHint;
            }
        } else {
            hint.classList.add('hidden');
        }
    } catch (e) {
        statusEl.textContent = 'Protocol 失败';
        statusEl.style.color = 'var(--neon-red)';
        hint.classList.remove('hidden');
        hint.textContent = '无法访问 Next-k-protocol：' + e.message + ' · base=' + PROTOCOL_BASE;
    }
}
ping();
setInterval(ping, 15000);
</script>
</body>
</html>
