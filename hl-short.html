<script>
const API = resolveApiBase();
const DESK_CLIENTS = (() => {
    try {
        const raw = localStorage.getItem('NEXT_K_DESK_CLIENTS');
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) return parsed;
        }
    } catch (e) { /* ignore */ }
    return [
        { id: 'client_a', label: '账户 A', url: 'https://client-a-production.up.railway.app' },
        { id: 'client_b', label: '账户 B', url: 'https://client-b-production-49bb.up.railway.app' },
        { id: 'client_c', label: '账户 C', url: 'https://client-c-production-768c.up.railway.app' },
        { id: 'client_d', label: '账户 D', url: 'https://client-d-production.up.railway.app' },
        { id: 'client_e', label: '账户 E', url: 'https://client-e-production.up.railway.app' },
        { id: 'client_f', label: '账户 F', url: 'https://client-f-production.up.railway.app' },
    ];
})();
let activeDesk = 'origin';
let pollTimer = null;

function setStatus(ok, text) {
    const el = document.getElementById('connection-status');
    el.className = ok
        ? 'status-pill status-pill-ok bg-neon-green/[0.07] text-neon-green border-neon-green/18'
        : 'status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18';
    el.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
}

function fmtUsd(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    const abs = Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + abs;
}

function escapeHtml(s) {
    return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function fmtPx(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    if (v <= 0) return '—';
    if (v >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (v >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return v.toLocaleString(undefined, { maximumFractionDigits: 6 });
}

function tickBjClock() {
    const el = document.getElementById('header-bj-clock');
    if (!el) return;
    try {
        const now = new Date();
        const t = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(now);
        el.textContent = t + ' 北京';
    } catch (e) {
        el.textContent = '--:-- 北京';
    }
}

function fmtBjTime(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '—';
        return new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(d);
    } catch (e) {
        return '—';
    }
}

const CLOSE_ACTIONS = new Set([
    'close', 'reduce', 'flip',
    'risk_halt_close', 'risk_tp_close', 'risk_sl_close', 'risk_tp_reduce',
]);

function isCloseFill(f) {
    if (!f || f.skipped) return false;
    const dir = String(f.dir || '').toLowerCase();
    if (dir.includes('close')) return true;
    const act = String(f.action || '').replace(/^sync_/, '');
    return CLOSE_ACTIONS.has(act);
}

function botAllFills(paper, bot) {
    const local = Array.isArray(bot.fills) ? bot.fills : [];
    const fromAgg = (paper.fills || []).filter((f) => f.source === bot.id || f.bot_id === bot.id);
    return local.length ? local : fromAgg;
}

function collectCoinPnlRows(paper) {
    const bots = sortedDeskBots(paper);
    const byCoin = new Map();

    function ensure(coin) {
        const key = String(coin || '').trim();
        if (!key) return null;
        if (!byCoin.has(key)) {
            byCoin.set(key, {
                coin: key,
                open: false,
                side: '',
                u_pnl: null,
                realized: null,
                hasRealized: false,
                closes: 0,
                last_ts: null,
            });
        }
        return byCoin.get(key);
    }

    for (const b of bots) {
        const fromBg = b.coin_pnl && typeof b.coin_pnl === 'object' ? b.coin_pnl : {};
        for (const [coin, info] of Object.entries(fromBg)) {
            const row = ensure(coin);
            if (!row || !info || typeof info !== 'object') continue;
            if (info.realized != null && info.realized !== '') {
                const rp = Number(info.realized);
                if (Number.isFinite(rp)) {
                    row.realized = rp;
                    row.hasRealized = true;
                }
            }
            if (info.closes != null) row.closes = Number(info.closes) || row.closes;
            if (info.last_ts) row.last_ts = info.last_ts;
        }

        for (const p of botPositions(paper, b)) {
            const row = ensure(p.coin);
            if (!row) continue;
            row.open = true;
            const sz = Number(p.sz);
            row.side = sz > 0 ? '多' : (sz < 0 ? '空' : '');
            row.u_pnl = Number(p.u_pnl);
            if (!Number.isFinite(row.u_pnl)) row.u_pnl = 0;
        }

        // Paper seats: fall back to fill realized when Bitget history absent.
        if (!Object.keys(fromBg).length) {
            for (const f of botAllFills(paper, b)) {
                if (!f || f.skipped) continue;
                const row = ensure(f.coin);
                if (!row) continue;
                const ts = f.ts || null;
                if (ts && (!row.last_ts || String(ts) > String(row.last_ts))) {
                    row.last_ts = ts;
                }
                if (!isCloseFill(f)) continue;
                row.closes += 1;
                if (f.realized_pnl != null && f.realized_pnl !== '') {
                    const rp = Number(f.realized_pnl);
                    if (Number.isFinite(rp)) {
                        row.realized = (row.realized || 0) + rp;
                        row.hasRealized = true;
                    }
                }
            }
        }
    }

    return Array.from(byCoin.values()).map((r) => {
        const up = r.open && Number.isFinite(Number(r.u_pnl)) ? Number(r.u_pnl) : 0;
        const rp = r.hasRealized ? Number(r.realized) : 0;
        const hasAny = r.open || r.hasRealized;
        r.total = hasAny ? (up + (r.hasRealized ? rp : 0)) : null;
        r.hasTotal = hasAny && (r.open || r.hasRealized);
        return r;
    }).sort((a, b) => {
        if (a.open !== b.open) return a.open ? -1 : 1;
        const ta = Math.abs(Number(a.total) || 0);
        const tb = Math.abs(Number(b.total) || 0);
        if (ta !== tb) return tb - ta;
        return String(a.coin).localeCompare(String(b.coin));
    });
}

function coinPnlRowsHtml(rows) {
    if (!rows.length) {
        return '<tr><td colspan="6" class="text-text-muted">暂无币种盈亏</td></tr>';
    }
    return rows.map((r) => {
        const status = r.open ? '持仓' : '已平';
        const sideCls = r.side === '多' ? 'pos' : (r.side === '空' ? 'neg' : '');
        const total = r.hasTotal ? Number(r.total) : null;
        const totalCell = total == null
            ? '<span class="text-text-muted">—</span>'
            : `<span class="${total >= 0 ? 'pos' : 'neg'}">${fmtUsd(total)}</span>`;
        const upnl = r.open
            ? `<span class="${r.u_pnl >= 0 ? 'pos' : 'neg'}">${fmtUsd(r.u_pnl)}</span>`
            : '<span class="text-text-muted">—</span>';
        const rpnl = r.hasRealized
            ? `<span class="${r.realized >= 0 ? 'pos' : 'neg'}">${fmtUsd(r.realized)}</span>`
            : '<span class="text-text-muted">—</span>';
        return `<tr>
            <td class="coin">${escapeHtml(r.coin)}</td>
            <td>${status}</td>
            <td class="${sideCls}">${r.side || '—'}</td>
            <td class="num">${totalCell}</td>
            <td class="num">${upnl}</td>
            <td class="num">${rpnl}</td>
        </tr>`;
    }).join('');
}

function renderClosedHistory(paper) {
    const bots = sortedDeskBots(paper);
    const rows = collectCoinPnlRows(paper);
    const tbody = document.getElementById('closed-tbody');
    if (tbody) tbody.innerHTML = coinPnlRowsHtml(rows);
    const sub = document.getElementById('closed-sub');
    if (sub) {
        const who = bots.length === 1 ? botLabel(bots[0].id) : '账户';
        const openN = rows.filter((r) => r.open).length;
        const closedN = rows.length - openN;
        const tot = rows.reduce((s, r) => s + (r.hasTotal ? Number(r.total) || 0 : 0), 0);
        sub.textContent = `${who} · ${rows.length} 币（持仓 ${openN} / 已平 ${closedN}）· 合计 ${fmtUsd(tot)}`;
    }
}

function sideClass(szi) {
    const n = Number(szi);
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return '';
}

function notionalU(sz, px) {
    const s = Number(sz);
    const p = Number(px);
    if (!Number.isFinite(s) || !Number.isFinite(p) || p <= 0) return null;
    return s * p;
}

function fmtPosU(sz, px) {
    const n = notionalU(sz, px);
    if (n == null) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function botLabel(id) {
    const fromCfg = DESK_CLIENTS.find((c) => c.id === id);
    if (fromCfg && fromCfg.label) return fromCfg.label;
    const map = {
        bot_c: '账户',
        client_a: '账户 A',
        client_b: '账户 B',
        client_c: '账户 C',
        client_d: '账户 D',
        client_e: '账户 E',
        client_f: '账户 F',
    };
    return map[id] || id || '账户';
}

function botTag(b) {
    const raw = (b && (b.tag || b.ht_style || b.style)) || '';
    const s = String(raw).toLowerCase();
    if (raw === '日内' || s === 'day_trader' || s === 'day' || s.startsWith('day')) {
        return { label: '日内', cls: 'is-day' };
    }
    if (raw === '波段' || s === 'swing_trader' || s === 'swing' || s.startsWith('swing')) {
        return { label: '波段', cls: 'is-swing' };
    }
    return null;
}

function botTagHtml(b) {
    const parts = [];
    if (b && (b.live_only || b.paper === false || b.live === true || b.venue === 'bitget' || b.venue === 'binance')) {
        parts.push('<span class="bot-tag is-live">实盘</span>');
    }
    const main = botTag(b);
    if (main) parts.push(`<span class="bot-tag ${main.cls}">${main.label}</span>`);
    return parts.join('');
}

const BOT_ORDER = ['bot_c'];

let lastPaper = null;

function sortedBots(paper) {
    const bots = Object.values(paper.bots || {});
    return bots.sort((a, b) => {
        const ia = BOT_ORDER.indexOf(a.id);
        const ib = BOT_ORDER.indexOf(b.id);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
}

function sortedDeskBots(paper) {
    return sortedBots(paper);
}

function botCardHtml(paper, b) {
    const halted = b.risk_halted ? '<span class="bot-halt">熔断</span>' : '';
    const nested = botPositions(paper, b);
    const upnl2 = nested.reduce((s, p) => s + (Number(p.u_pnl) || 0), 0);
    const nPos = nested.length;
    const initBal = b.live_only || b.paper === false
        ? (b.balance != null ? Number(b.balance) : (b.equity != null ? Number(b.equity) : NaN))
        : (b.paper_balance != null ? Number(b.paper_balance) : Number(b.balance));
    const balTag = Number.isFinite(initBal)
        ? ` · ${b.live_only || b.paper === false ? '实盘 ' : ''}${Math.round(initBal)}U`
        : '';
    const venueLabel = String(b.venue || '').toLowerCase() === 'bitget'
        ? 'Bitget'
        : (String(b.venue || '').toLowerCase() === 'binance' ? '币安' : '交易所');
    const liveErr = b.live_error
        ? `<div class="bot-health bad">${venueLabel}：${escapeHtml(String(b.live_error))}</div>`
        : '';
    const upnlLive = (b.live_only || b.paper === false) && b.u_pnl != null
        ? Number(b.u_pnl)
        : upnl2;
    const h = b.target_health || {};
    const healthCls = !h.status || h.status === 'ok'
        ? ''
        : (h.empty ? ' is-bad' : ' is-warn');
    const tav = h.target_av != null ? h.target_av : b.target_av;
    let healthLine = '';
    if (h.status && h.status !== 'ok') {
        const bits = [h.label || h.status];
        if (h.quiet_hours != null) bits.push(`静默 ${Number(h.quiet_hours).toFixed(1)}h`);
        healthLine = `<div class="bot-health ${h.empty ? 'bad' : 'warn'}">${bits.join(' · ')}</div>`;
    }
    const fundLine = tav != null
        ? `<div class="bot-health" style="color:var(--text-muted);font-weight:400;">对方永续 $${Number(tav).toLocaleString(undefined, { maximumFractionDigits: 0 })}</div>`
        : '';
    const isLive = !!(b.live_only || b.paper === false);
    const thirdLabel = isLive ? '可用' : '已实现';
    let thirdVal;
    if (isLive) {
        thirdVal = b.live_available != null ? Number(b.live_available) : (b.balance != null ? Number(b.balance) : 0);
    } else {
        thirdVal = Number(b.realized_pnl);
    }
    const thirdHtml = `<span class="stat-value">${fmtUsd(thirdVal)}</span>`;
    return `<div class="bot-card${healthCls}" data-bot-id="${b.id}">
        <div class="bot-card-top">
            <div class="bot-card-name"><span>${botLabel(b.id)}</span>${botTagHtml(b)}${halted}</div>
            <div class="bot-card-meta">
                <span>${nPos} 仓${balTag}</span>
                <button type="button" class="bot-reset" data-bot-reset="${b.id}" title="${isLive ? '平掉币安仓位' : '重置此席位'}">重置</button>
            </div>
        </div>
        <div class="bot-stats">
            <div class="bot-stat">
                <span class="stat-label">${isLive ? '实盘权益' : '权益'}</span>
                <span class="stat-value equity">${fmtUsd(b.equity)}</span>
            </div>
            <div class="bot-stat">
                <span class="stat-label">浮盈</span>
                <span class="stat-value ${upnlLive >= 0 ? 'pos' : 'neg'}">${fmtUsd(upnlLive)}</span>
            </div>
            <div class="bot-stat">
                <span class="stat-label">${thirdLabel}</span>
                ${thirdHtml}
            </div>
        </div>
        ${liveErr}${healthLine}${fundLine}
    </div>`;
}

function strategyBlockHtml(paper, b) {
    const positions = botPositions(paper, b);
    return `<div class="strategy-block">
        <div class="strategy-block-head">
            <div class="strategy-block-title"><span>${botLabel(b.id)}</span>${botTagHtml(b)}</div>
            <div class="strategy-block-meta">${positions.length} 仓</div>
        </div>
        <div class="scroll-panel">
            <table class="data-table tbl-pos">
                <colgroup>
                    <col class="c-coin" /><col class="c-entry" /><col class="c-mark" />
                    <col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />
                </colgroup>
                <thead><tr>
                    <th>币</th><th class="num">开仓价</th><th class="num">标记价</th>
                    <th class="num">仓位(U)</th><th class="num">杠杆</th><th class="num">浮盈</th>
                </tr></thead>
                <tbody>${posRowsHtml(positions)}</tbody>
            </table>
        </div>
    </div>`;
}

function botPositions(paper, bot) {
    const nested = bot.positions && typeof bot.positions === 'object' && !Array.isArray(bot.positions)
        ? Object.values(bot.positions)
        : [];
    if (nested.length) return nested;
    return Object.values(paper.positions || {}).filter((p) => p.source === bot.id);
}

function posRowsHtml(positions) {
    if (!positions.length) {
        return '<tr><td colspan="6" class="text-text-muted">空仓</td></tr>';
    }
    return positions.map((p) => {
        const mark = p.mark_px != null ? p.mark_px : p.entry_px;
        const up = Number(p.u_pnl);
        const lev = p.leverage != null ? Number(p.leverage).toFixed(1) + 'x' : '—';
        return `<tr>
            <td class="coin">${p.coin}</td>
            <td class="num">${fmtPx(p.entry_px)}</td>
            <td class="num">${fmtPx(mark)}</td>
            <td class="num ${sideClass(p.sz)}">${fmtPosU(p.sz, mark)}</td>
            <td class="num">${lev}</td>
            <td class="num ${up >= 0 ? 'pos' : 'neg'}">${fmtUsd(up)}</td>
        </tr>`;
    }).join('');
}

function renderPaper(paper) {
    lastPaper = paper;
    const deskBots = sortedDeskBots(paper);

    const strip = document.getElementById('bots-strip');
    strip.innerHTML = deskBots.map((b) => botCardHtml(paper, b)).join('')
        || '<p class="text-text-muted text-sm">暂无账户</p>';

    document.getElementById('pos-by-strategy').innerHTML = deskBots.map((b) => strategyBlockHtml(paper, b)).join('')
        || '<p class="text-text-muted text-sm">暂无仓位</p>';

    renderClosedHistory(paper);

    const { sub } = deskBalanceLine(deskBots);
    const subEl = document.getElementById('bots-sub');
    if (subEl && sub) subEl.textContent = sub;
}

function deskBalanceLine(bots) {
    const list = Array.isArray(bots) ? bots : [];
    const pairs = list.map((b) => {
        const v = b.paper_balance != null ? Number(b.paper_balance) : Number(b.balance);
        return {
            id: b.id,
            bal: Number.isFinite(v) ? Math.round(v) : null,
        };
    }).filter((x) => x.bal != null);
    const range = deskSeatRangeLabel(list);
    if (!pairs.length) return { line: `${list.length} 账户`, sub: `${range} · 两列` };
    const uniq = [...new Set(pairs.map((p) => p.bal))];
    if (uniq.length === 1) {
        return {
            line: `${list.length} 账户 · 各 ${uniq[0]}U`,
            sub: `${range} · 两列 · 各 ${uniq[0]}U`,
        };
    }
    const parts = pairs.map((p) => `${botLabel(p.id).replace('账户 ', '')}${p.bal}U`);
    return {
        line: parts.join(' · '),
        sub: `${range} · 两列 · ${parts.join(' · ')}`,
    };
}

function deskSeatRangeLabel(bots) {
    const n = (bots || []).length;
    if (n <= 1) return '账户';
    return `${n} 账户`;
}

function renderCopyStatus(st) {
    const ws = document.getElementById('ws-badge');
    if (!st) {
        ws.textContent = 'WS —';
        return;
    }
    ws.textContent = st.running ? `WS 在线 · ${st.fills_seen || 0}` : 'WS 离线';
    const paper = st.paper || lastPaper || {};
    const deskList = sortedDeskBots(paper);
    const bots = sortedBots(paper);
    const { line: balLine, sub } = deskBalanceLine(deskList);
    let line = balLine;
    const cfg = (paper && paper.config) || (st.config) || {};
    const tp = Number(cfg.portfolio_tp_pct);
    const tpHard = Number(cfg.portfolio_tp_hard_pct);
    const sl = Number(cfg.portfolio_sl_pct);
    const peakDdLimit = Number(cfg.portfolio_peak_dd_pct);
    const botSl = Number(cfg.daily_loss_pct);
    const ret = paper.portfolio_return_pct != null ? Number(paper.portfolio_return_pct) : null;
    const anchor = paper.portfolio_anchor_equity != null ? Number(paper.portfolio_anchor_equity) : null;
    const eq = paper.portfolio_equity != null ? Number(paper.portfolio_equity) : (paper.equity != null ? Number(paper.equity) : null);
    const peak = paper.portfolio_peak_equity != null ? Number(paper.portfolio_peak_equity) : null;
    const peakDd = paper.portfolio_peak_dd_pct != null ? Number(paper.portfolio_peak_dd_pct) : null;
    if (ret != null && Number.isFinite(ret) && anchor != null) {
        const sign = ret >= 0 ? '+' : '';
        const hasDeskRisk = (Number.isFinite(tp) && tp > 0)
            || (Number.isFinite(tpHard) && tpHard > 0)
            || (Number.isFinite(sl) && sl > 0);
        const band = hasDeskRisk
            ? ` · 软+${(tp * 100).toFixed(1)}%/硬+${(Number.isFinite(tpHard) ? tpHard * 100 : 0).toFixed(0)}%/−${(sl * 100).toFixed(0)}%`
            : '';
        const peakBand = (Number.isFinite(peakDdLimit) && peakDdLimit > 0)
            ? ` · 峰值回撤−${(peakDdLimit * 100).toFixed(0)}%全平`
            : '';
        const peakNow = (Number.isFinite(peakDd) && Number.isFinite(peak))
            ? ` · 现回撤${(peakDd * 100).toFixed(1)}%(峰$${peak.toLocaleString(undefined, { maximumFractionDigits: 0 })})`
            : '';
        const botBand = (Number.isFinite(botSl) && botSl > 0)
            ? ` · 单号−${(botSl * 100).toFixed(0)}%熔断(冷却解)`
            : '';
        const scale = paper.portfolio_copy_scale != null ? Number(paper.portfolio_copy_scale) : 1;
        const scaleBand = (Number.isFinite(scale) && scale < 0.999)
            ? ` · 跟单×${scale.toFixed(2)}`
            : '';
        line = `总账户 ${sign}${(ret * 100).toFixed(2)}% · 权益 $${Number(eq || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })} · 锚点 $${anchor.toLocaleString(undefined, { maximumFractionDigits: 0 })}${band}${peakBand}${peakNow}${botBand}${scaleBand}`;
    }
    const alerts = [];
    for (const b of bots) {
        const h = b.target_health || {};
        if (h.status && h.status !== 'ok') {
            alerts.push(`${botLabel(b.id)}${h.label || h.status}`);
        }
    }
    const pr = paper.portfolio_risk || {};
    let tripFresh = false;
    if (pr.tripped_at) {
        try {
            tripFresh = (Date.now() - new Date(pr.tripped_at).getTime()) < 10 * 60 * 1000;
        } catch (e) {
            tripFresh = false;
        }
    }
    if (tripFresh && pr.reason === 'portfolio_tp_soft') {
        line = `总账软止盈已减仓 · 跟单×${Number(pr.copy_scale != null ? pr.copy_scale : paper.portfolio_copy_scale || 0.5).toFixed(2)} · 等硬止盈/止损或继续跟`;
    } else if (tripFresh && (pr.reason === 'portfolio_tp_hard' || pr.reason === 'portfolio_tp')) {
        line = `总账硬止盈 · 复利锚点 $${Number(pr.anchor_after || anchor || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })} · 等新单`;
    } else if (tripFresh && pr.reason === 'portfolio_sl') {
        line = `总账止损 · 复利锚点 $${Number(pr.anchor_after || anchor || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })} · 等新单`;
    } else if (tripFresh && pr.reason === 'portfolio_peak_dd') {
        line = `总账峰值回撤全平 · 峰值重置 $${Number(pr.peak_after || pr.anchor_after || anchor || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })} · 等新单`;
    } else if (tripFresh && pr.reason === 'portfolio_multi_halt') {
        line = `多号熔断触发整桌重置 · 锚点 $${Number(pr.anchor_after || anchor || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
    }
    const halted = bots.filter((b) => b.risk_halted);
    if (alerts.length) {
        line = `注意：${alerts.join(' · ')}`;
    } else if (halted.length) {
        line = `熔断：${halted.map((b) => botLabel(b.id)).join(', ')}`;
    }
    document.getElementById('status-line').textContent = line;
    const subEl = document.getElementById('bots-sub');
    if (subEl && sub) subEl.textContent = sub;
}

async function fetchPaper(mark) {
    const q = mark ? '?mark=true' : '';
    const res = await fetch(`${API}/api/hl-short/paper${q}`);
    if (!res.ok) throw new Error('paper ' + res.status);
    return res.json();
}

async function fetchCopyStatus() {
    const res = await fetch(`${API}/api/hl-short/copy/status`);
    if (!res.ok) throw new Error('copy ' + res.status);
    return res.json();
}

function deskClientById(id) {
    return DESK_CLIENTS.find((c) => c.id === id) || null;
}

async function fetchClientDeskPaper(clientId) {
    const cfg = deskClientById(clientId);
    if (!cfg) throw new Error('unknown client ' + clientId);
    const base = String(cfg.url || '').replace(/\/$/, '');
    const res = await fetch(`${base}/live/desk`, { mode: 'cors' });
    if (!res.ok) throw new Error(cfg.label + ' ' + res.status);
    const data = await res.json();
    const bot = (data && data.bot) || {};
    bot.id = cfg.id;
    bot.live_only = true;
    bot.paper = false;
    bot.live = true;
    bot.venue = bot.venue || 'bitget';
    bot.desk_url = base;
    const equity = Number(bot.equity) || 0;
    return {
        bots: { [cfg.id]: bot },
        positions: {},
        equity,
        portfolio_equity: equity,
        u_pnl: Number(bot.u_pnl) || 0,
        as_of: new Date().toISOString(),
        live_meta: data.live || null,
    };
}

function syncDeskChrome() {
    const kicker = document.getElementById('panel-kicker');
    const title = document.getElementById('panel-title');
    const resetBtn = document.getElementById('btn-paper-reset');
    if (activeDesk === 'origin') {
        if (kicker) kicker.textContent = 'Paper · Hyperliquid';
        if (title) title.textContent = '交易桌';
        if (resetBtn) resetBtn.style.display = '';
    } else {
        const cfg = deskClientById(activeDesk);
        if (kicker) kicker.textContent = 'Live · Bitget KYC · 跟 bot_c';
        if (title) title.textContent = (cfg && cfg.label) || 'KYC';
        if (resetBtn) resetBtn.style.display = 'none';
    }
    document.querySelectorAll('#desk-tabs .desk-tab').forEach((btn) => {
        const on = btn.dataset.desk === activeDesk;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
}

let pollTick = 0;

async function loadAll(refresh) {
    syncDeskChrome();
    try {
        pollTick += 1;
        if (activeDesk === 'origin') {
            const wantMark = !!refresh || (pollTick % 3 === 0);
            const paper = await fetchPaper(wantMark);
            renderPaper(paper);
            const st = await fetchCopyStatus().catch((e) => {
                console.warn('copy/status', e);
                return null;
            });
            if (st) renderCopyStatus(st);
            setStatus(true, '已连接');
            return;
        }
        const paper = await fetchClientDeskPaper(activeDesk);
        renderPaper(paper);
        const ws = document.getElementById('ws-badge');
        const live = paper.live_meta || {};
        if (ws) {
            const dry = live.dry_run ? 'DRY' : 'LIVE';
            ws.textContent = live.live_ready ? `KYC · ${dry}` : `KYC · 未就绪`;
        }
        const bot = Object.values(paper.bots || {})[0];
        const statusLine = document.getElementById('status-line');
        if (statusLine) {
            if (bot && bot.live_error) {
                statusLine.textContent = String(bot.live_error);
            } else {
                statusLine.textContent = `${botLabel(activeDesk)} · 跟 bot_c · Bitget 实盘`;
            }
        }
        setStatus(!(bot && bot.live_error), bot && bot.live_error ? '异常' : '已连接');
    } catch (err) {
        console.error(err);
        const detail = String(err.message || err).slice(0, 48);
        setStatus(false, detail ? `连接失败 · ${detail}` : '连接失败');
        document.getElementById('status-line').textContent = String(err.message || err);
    }
}

document.getElementById('desk-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.desk-tab');
    if (!btn || !btn.dataset.desk) return;
    activeDesk = btn.dataset.desk;
    pollTick = 0;
    loadAll(true);
});

document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('btn-paper-reset').addEventListener('click', async () => {
    if (activeDesk !== 'origin') {
        alert('KYC 实盘请在 Bitget 平仓');
        return;
    }
    if (!confirm('重置全部模拟账本？')) return;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset`, { method: 'POST' });
        if (!res.ok) throw new Error('reset ' + res.status);
        await loadAll(false);
    } catch (err) {
        alert(String(err.message || err));
    }
});

async function resetOneBot(botId, btn) {
    const id = String(botId || '').trim();
    if (!id) return;
    if (String(id).startsWith('client_') || activeDesk !== 'origin') {
        alert(`${botLabel(id)} 为 KYC 实盘，请到 Bitget 平仓。`);
        return;
    }
    const bot = lastPaper && lastPaper.bots ? lastPaper.bots[id] : null;
    const isLiveOnly = !!(bot && (bot.live_only || bot.paper === false));
    const venue = String((bot && bot.venue) || '').toLowerCase();
    const msg = isLiveOnly
        ? `平掉 ${botLabel(id)} 实盘仓位？不会再走纸面账本。`
        : (bot && bot.live
            ? `重置 ${botLabel(id)} 纸面并同步${venue === 'bitget' ? ' Bitget' : ''}平仓？`
            : `重置 ${botLabel(id)}？将清空该席仓位与成交，恢复初始资金。`);
    if (!confirm(msg)) return;
    if (btn) btn.disabled = true;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset/${encodeURIComponent(id)}`, {
            method: 'POST',
        });
        if (!res.ok) {
            let detail = 'reset ' + res.status;
            try {
                const body = await res.json();
                if (body && body.detail) detail = String(body.detail);
            } catch (_) {}
            throw new Error(detail);
        }
        await loadAll(false);
    } catch (err) {
        alert(String(err.message || err));
    } finally {
        if (btn) btn.disabled = false;
    }
}

document.getElementById('bots-strip').addEventListener('click', (e) => {
    const resetBtn = e.target.closest('[data-bot-reset]');
    if (resetBtn) {
        e.preventDefault();
        e.stopPropagation();
        resetOneBot(resetBtn.dataset.botReset, resetBtn);
    }
});

loadAll(true);
pollTimer = setInterval(() => loadAll(false), 15000);
tickBjClock();
setInterval(tickBjClock, 1000);
</script>
