<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next K · HL 短线</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="api-base.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                        sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-light': 'var(--surface-light)',
                        border: 'var(--border)',
                        accent: 'var(--accent)',
                        gold: 'var(--gold)',
                        'neon-green': 'var(--neon-green)',
                        'neon-red': 'var(--neon-red)',
                        'neon-blue': 'var(--neon-blue)',
                        warn: 'var(--warn)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                    },
                },
            },
        };
    </script>
    <style>
        .focus-hero {
            border: 1px solid color-mix(in srgb, var(--gold) 28%, var(--border));
            border-radius: var(--radius-lg);
            background:
                radial-gradient(ellipse 80% 70% at 12% 0%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
                linear-gradient(165deg, color-mix(in srgb, var(--surface-light) 70%, var(--surface)) 0%, var(--surface) 100%);
            padding: 1.35rem 1.5rem;
        }
        .metric-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: var(--radius-sm);
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            background: color-mix(in srgb, var(--surface-light) 40%, transparent);
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }
        .stat {
            min-width: 7rem;
        }
        .stat-label {
            font-size: 0.625rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .stat-value {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 1.35rem;
            line-height: 1.2;
            margin-top: 0.2rem;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .data-table thead th {
            padding: 0.5rem 0.55rem;
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table tbody td {
            padding: 0.45rem 0.55rem;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
        }
        .pos { color: var(--neon-green); }
        .neg { color: var(--neon-red); }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.7rem; }
        .section-title {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 1rem;
            font-weight: 600;
        }
        .section-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }
    </style>
</head>
<body class="min-h-screen">
<header class="app-header sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-2.5">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <div class="flex items-center gap-2.5 shrink-0">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title text-text-primary">Next <span class="text-accent">K</span></h1>
                        <div class="brand-subtitle hidden sm:block">HL 短线</div>
                    </div>
                </div>
                <nav class="hidden sm:flex items-center gap-1.5 ml-2">
                    <a class="nav-pill" href="index.html">策略看板</a>
                    <a class="nav-pill" href="alpha.html">Alpha 筹码</a>
                    <a class="nav-pill" href="trading-os.html">Trading OS</a>
                    <a class="nav-pill nav-pill-active" href="hl-short.html">HL 短线</a>
                    <a class="nav-pill" href="factor-sector.html">板块因子</a>
                    <a class="nav-pill" href="clawby-quant.html">Clawby Quant</a>
                    <a class="nav-pill" href="grid.html">Next K 网格</a>
                </nav>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="btn-refresh" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">刷新</button>
                <div id="connection-status" class="status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18">
                    <span class="status-dot"></span><span>连接中…</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="focus-hero" aria-label="模拟跟单">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <div class="panel-kicker">Paper Copy · Hyperliquid</div>
                <h2 class="panel-title text-xl mt-1">双机器人完美跟单</h2>
                <p id="status-line" class="panel-sub mt-1">载入中…</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <span id="ws-badge" class="metric-chip">WS —</span>
                <button id="btn-paper-reset" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">重置</button>
            </div>
        </div>
        <div id="bots-strip" class="mt-5 grid sm:grid-cols-2 gap-4"></div>
    </section>

    <section aria-label="仓位">
        <h3 class="section-title">机器人仓位</h3>
        <p class="section-sub">各投 1000U · 地址开多少比例 / 多少杠杆，机器人就开多少</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-paper-pos">
                <thead>
                    <tr><th>机器人</th><th>币</th><th>仓位(U)</th><th>杠杆</th><th>浮盈</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section aria-label="记录">
        <h3 class="section-title">跟单记录</h3>
        <p class="section-sub">开平同步日志</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-paper-fills">
                <thead>
                    <tr><th>时间</th><th>机器人</th><th>动作</th><th>币</th><th>名义(U)</th><th>杠杆</th><th>盈亏</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section aria-label="跟谁">
        <h3 class="section-title">绑定地址</h3>
        <p class="section-sub">一机器人一地址</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-targets">
                <thead>
                    <tr><th>目标</th><th>胜率</th><th>账户</th><th>持仓(U)</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>

<script>
const API = resolveApiBase();
let pollTimer = null;

function setStatus(ok, text) {
    const el = document.getElementById('connection-status');
    el.className = ok
        ? 'status-pill status-pill-ok bg-neon-green/[0.07] text-neon-green border-neon-green/18'
        : 'status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18';
    el.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
}

function fmtUsd(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    const abs = Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + abs;
}

function fmtPct(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    return (Number(n) * 100).toFixed(0) + '%';
}

function shortAddr(a) {
    if (!a) return '—';
    return a.slice(0, 6) + '…' + a.slice(-4);
}

function sideClass(szi) {
    const n = Number(szi);
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return '';
}

/** Signed notional in U (USDT). Long +, short -. */
function notionalU(sz, px) {
    const s = Number(sz);
    const p = Number(px);
    if (!Number.isFinite(s) || !Number.isFinite(p) || p <= 0) return null;
    return s * p;
}

function fmtPosU(sz, px) {
    const n = notionalU(sz, px);
    if (n == null) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function renderPaper(paper) {
    const bots = Object.values(paper.bots || {});
    const strip = document.getElementById('bots-strip');
    strip.innerHTML = bots.map((b) => {
        const halted = b.risk_halted ? ' · 熔断' : '';
        const ratio = b.copy_ratio != null ? (Number(b.copy_ratio) * 100).toFixed(4) + '%' : '—';
        const upnl = Object.values(b.positions || {}).reduce((s, p) => s + (Number(p.u_pnl) || 0), 0);
        // when bots come from aggregate API without nested positions, compute from flat list
        const nested = b.positions && typeof b.positions === 'object' && !Array.isArray(b.positions)
            ? Object.values(b.positions)
            : [];
        const upnl2 = nested.length
            ? nested.reduce((s, p) => s + (Number(p.u_pnl) || 0), 0)
            : (Object.values(paper.positions || {}).filter((p) => p.source === b.id)
                .reduce((s, p) => s + (Number(p.u_pnl) || 0), 0));
        return `<div class="rounded border border-border bg-surface/80 p-3">
            <div class="flex justify-between gap-2 items-start">
                <div>
                    <div class="font-serif text-base">${b.id || 'bot'}${halted}</div>
                    <div class="mono text-text-muted mt-0.5">${shortAddr(b.address)}</div>
                </div>
                <span class="metric-chip">比例 ${ratio}</span>
            </div>
            <div class="mt-3 flex flex-wrap gap-5">
                <div class="stat"><div class="stat-label">权益</div><div class="stat-value text-lg">${fmtUsd(b.equity)}</div></div>
                <div class="stat"><div class="stat-label">浮盈</div><div class="stat-value text-lg ${upnl2 >= 0 ? 'pos' : 'neg'}">${fmtUsd(upnl2)}</div></div>
                <div class="stat"><div class="stat-label">已实现</div><div class="stat-value text-lg">${fmtUsd(b.realized_pnl)}</div></div>
            </div>
        </div>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无机器人</p>';

    const positions = Object.values(paper.positions || {});
    document.querySelector('#tbl-paper-pos tbody').innerHTML = positions.map((p) => {
        const mark = p.mark_px != null ? p.mark_px : p.entry_px;
        const up = Number(p.u_pnl);
        const lev = p.leverage != null ? Number(p.leverage).toFixed(1) + 'x' : '—';
        return `<tr>
            <td>${p.source || '—'}</td>
            <td class="font-medium">${p.coin}</td>
            <td class="${sideClass(p.sz)}">${fmtPosU(p.sz, mark)}</td>
            <td>${lev}</td>
            <td class="${up >= 0 ? 'pos' : 'neg'}">${fmtUsd(up)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" class="text-text-muted">暂无持仓</td></tr>';

    const fills = (paper.fills || []).filter((f) => !f.skipped && f.action !== 'signal').slice(0, 30);
    document.querySelector('#tbl-paper-fills tbody').innerHTML = fills.map((f) => {
        const ts = (f.ts || '').replace('T', ' ').slice(11, 19);
        const isOpen = String(f.action || '').includes('open');
        const rp = f.realized_pnl != null ? Number(f.realized_pnl) : null;
        const notion = f.notional != null ? Number(f.notional) : Math.abs(notionalU(f.our_sz, f.px) || 0);
        const sell = f.side === 'sell' || String(f.action || '').includes('close');
        const notionLabel = !notion
            ? '—'
            : (sell ? '-' : '+') + '$' + Math.abs(notion).toLocaleString(undefined, { maximumFractionDigits: 0 });
        const lev = f.leverage != null ? Number(f.leverage).toFixed(1) + 'x' : '—';
        const pnlCell = isOpen
            ? '<span class="text-text-muted">—</span>'
            : `<span class="${rp == null ? '' : (rp >= 0 ? 'pos' : 'neg')}">${rp == null ? '—' : fmtUsd(rp)}</span>`;
        return `<tr>
            <td class="mono">${ts || '—'}</td>
            <td>${f.source || '—'}</td>
            <td>${f.action || f.side || '—'}</td>
            <td>${f.coin || '—'}</td>
            <td class="${sell ? 'neg' : 'pos'}">${notionLabel}</td>
            <td>${lev}</td>
            <td>${pnlCell}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="7" class="text-text-muted">等待同步</td></tr>';
}

function renderTargets(board) {
    const wallets = board.wallets || [];
    document.querySelector('#tbl-targets tbody').innerHTML = wallets.map((row) => {
        const m = row.meta || {};
        const s = row.snapshot || {};
        const url = m.hl_url || `https://app.hyperliquid.xyz/explorer/address/${m.address}`;
        const pos = (s.positions || []).map((p) => {
            const lev = p.lev != null ? ` ${p.lev}x` : '';
            return `${p.coin} <span class="${sideClass(p.szi)}">${fmtPosU(p.szi, p.entry)}</span>${lev}`;
        }).join(' · ') || '空仓';
        return `<tr>
            <td>
                <div class="font-medium">机器人 → ${m.id || shortAddr(m.address)}</div>
                <div class="mono text-text-muted">${shortAddr(m.address)}</div>
            </td>
            <td class="pos">${fmtPct(m.est_winrate)}</td>
            <td>${fmtUsd(s.account_value)}</td>
            <td class="text-text-secondary">${pos}</td>
            <td><a class="metric-chip hover:border-gold/40" href="${url}" target="_blank" rel="noopener">查看</a></td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" class="text-text-muted">无目标</td></tr>';
}

function renderCopyStatus(st) {
    const ws = document.getElementById('ws-badge');
    if (!st) {
        ws.textContent = 'WS —';
        return;
    }
    ws.textContent = st.running ? `WS 在线 · ${st.fills_seen || 0} 笔` : 'WS 离线';
    const n = (st.paper && st.paper.bot_count) || ((st.paper && st.paper.bots) || []).length || 2;
    let line = `${n} 个机器人各 1000U，一对一绑定地址，仓位比例与杠杆完全跟随。`;
    const halted = ((st.paper && st.paper.bots) || []).filter((b) => b.risk_halted);
    if (halted.length) {
        line = `风控熔断：${halted.map((b) => b.id).join(', ')} 已平仓观望`;
    }
    document.getElementById('status-line').textContent = line;
}

async function fetchBoard(refresh) {
    const res = await fetch(`${API}/api/hl-short/board${refresh ? '?refresh=true' : ''}`);
    if (!res.ok) throw new Error('board ' + res.status);
    return res.json();
}

async function fetchPaper() {
    const res = await fetch(`${API}/api/hl-short/paper`);
    if (!res.ok) throw new Error('paper ' + res.status);
    return res.json();
}

async function fetchCopyStatus() {
    const res = await fetch(`${API}/api/hl-short/copy/status`);
    if (!res.ok) throw new Error('copy ' + res.status);
    return res.json();
}

async function loadAll(refresh) {
    try {
        const [board, paper, st] = await Promise.all([
            fetchBoard(!!refresh),
            fetchPaper(),
            fetchCopyStatus(),
        ]);
        renderPaper(paper);
        renderTargets(board);
        renderCopyStatus(st);
        setStatus(true, '已连接');
    } catch (err) {
        console.error(err);
        setStatus(false, '连接失败');
        document.getElementById('status-line').textContent = String(err.message || err);
    }
}

document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('btn-paper-reset').addEventListener('click', async () => {
    if (!confirm('重置模拟账本？')) return;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset`, { method: 'POST' });
        if (!res.ok) throw new Error('reset ' + res.status);
        renderPaper(await res.json());
    } catch (err) {
        alert(String(err.message || err));
    }
});

loadAll(true);
pollTimer = setInterval(() => loadAll(false), 5000);
</script>
</body>
</html>
