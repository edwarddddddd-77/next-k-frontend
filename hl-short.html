<script>
const API = resolveApiBase();
let pollTimer = null;

function setStatus(ok, text) {
    const el = document.getElementById('connection-status');
    el.className = ok
        ? 'status-pill status-pill-ok bg-neon-green/[0.07] text-neon-green border-neon-green/18'
        : 'status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18';
    el.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
}

function fmtUsd(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    const abs = Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + abs;
}

function fmtPx(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    if (v <= 0) return '—';
    if (v >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (v >= 1) return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return v.toLocaleString(undefined, { maximumFractionDigits: 6 });
}

function fmtBjTime(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(0, 19);
        return new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(d);
    } catch (e) {
        return String(iso).slice(0, 19);
    }
}

function tickBjClock() {
    const el = document.getElementById('header-bj-clock');
    if (!el) return;
    try {
        const now = new Date();
        const t = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(now);
        el.textContent = t + ' 北京';
    } catch (e) {
        el.textContent = '--:-- 北京';
    }
}

function sideClass(szi) {
    const n = Number(szi);
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return '';
}

function notionalU(sz, px) {
    const s = Number(sz);
    const p = Number(px);
    if (!Number.isFinite(s) || !Number.isFinite(p) || p <= 0) return null;
    return s * p;
}

function fmtPosU(sz, px) {
    const n = notionalU(sz, px);
    if (n == null) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function botLabel(id) {
    const map = {
        bot_a: '策略 A',
        bot_b: '策略 B',
        bot_c: '策略 C',
        bot_d: '策略 D',
        bot_e: '策略 E',
        wr94_hype: '策略 A',
        wr72_multi: '策略 B',
        wr88_btc_ada: '策略 C',
        wr63_alts: '策略 D',
        wr75_btc_eth: '策略 E',
    };
    return map[id] || id || '策略';
}

const BOT_ORDER = ['wr94_hype', 'wr72_multi', 'wr88_btc_ada', 'wr63_alts', 'wr75_btc_eth'];
const FILL_REAL = new Set(['open', 'close', 'reduce', 'increase', 'risk_halt_close', 'flip']);
const FILL_LIMIT = 20;
const FILL_LIMIT_ALL = 40;
const ACT_LABEL = {
    open: '开仓',
    increase: '加仓',
    reduce: '减仓',
    close: '平仓',
    flip: '反手',
    risk_halt_close: '熔断平仓',
};

/** 多/空：优先用后端 pos；否则由 buy/sell + 动作推断 */
function fillPos(f) {
    const p = String(f.pos || f.position_side || '').toLowerCase();
    if (p === 'long' || p === 'l') return '多';
    if (p === 'short' || p === 's') return '空';
    const side = String(f.side || '').toLowerCase();
    const act = String(f.action || '').replace(/^sync_/, '');
    if (act === 'close' || act === 'reduce' || act === 'risk_halt_close') {
        // 卖平多、买平空
        if (side === 'sell') return '多';
        if (side === 'buy') return '空';
        return '';
    }
    if (side === 'buy') return '多';
    if (side === 'sell') return '空';
    return '';
}

function fillActLabel(f) {
    const actRaw = String(f.action || '').replace(/^sync_/, '');
    const base = ACT_LABEL[actRaw] || actRaw || '—';
    const pos = fillPos(f);
    if (!pos) return base;
    const withPos = {
        open: `开${pos}`,
        increase: `加${pos}`,
        reduce: `减${pos}`,
        close: `平${pos}`,
        flip: `反手开${pos}`,
        risk_halt_close: `熔断平${pos}`,
    };
    return withPos[actRaw] || `${base}·${pos}`;
}

let lastPaper = null;
let fillFilter = 'all';

function sortedBots(paper) {
    const bots = Object.values(paper.bots || {});
    return bots.sort((a, b) => {
        const ia = BOT_ORDER.indexOf(a.id);
        const ib = BOT_ORDER.indexOf(b.id);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
}

function botPositions(paper, bot) {
    const nested = bot.positions && typeof bot.positions === 'object' && !Array.isArray(bot.positions)
        ? Object.values(bot.positions)
        : [];
    if (nested.length) return nested;
    return Object.values(paper.positions || {}).filter((p) => p.source === bot.id);
}

function botFills(paper, bot) {
    const local = Array.isArray(bot.fills) ? bot.fills : [];
    const fromAgg = (paper.fills || []).filter((f) => f.source === bot.id);
    const pool = local.length ? local : fromAgg;
    return pool.filter((f) => {
        if (f.skipped) return false;
        const act = String(f.action || '').replace(/^sync_/, '');
        return FILL_REAL.has(act);
    });
}

function collectFills(paper, filterId) {
    const bots = sortedBots(paper);
    const rows = [];
    for (const b of bots) {
        if (filterId !== 'all' && b.id !== filterId) continue;
        for (const f of botFills(paper, b)) {
            rows.push(Object.assign({}, f, { _bot: b.id }));
        }
    }
    rows.sort((a, b) => {
        const ta = a.ts ? new Date(a.ts).getTime() : 0;
        const tb = b.ts ? new Date(b.ts).getTime() : 0;
        return tb - ta;
    });
    return rows.slice(0, filterId === 'all' ? FILL_LIMIT_ALL : FILL_LIMIT);
}

function setFillFilter(id) {
    fillFilter = id || 'all';
    if (lastPaper) renderFills(lastPaper);
    syncActiveChrome();
}

function syncActiveChrome() {
    document.querySelectorAll('.bot-card').forEach((el) => {
        el.classList.toggle('is-active', el.dataset.botId === fillFilter);
    });
    document.querySelectorAll('.fill-tab').forEach((el) => {
        el.classList.toggle('is-active', el.dataset.filter === fillFilter);
    });
}

function posRowsHtml(positions) {
    if (!positions.length) {
        return '<tr><td colspan="6" class="text-text-muted">空仓</td></tr>';
    }
    return positions.map((p) => {
        const mark = p.mark_px != null ? p.mark_px : p.entry_px;
        const up = Number(p.u_pnl);
        const lev = p.leverage != null ? Number(p.leverage).toFixed(1) + 'x' : '—';
        return `<tr>
            <td class="coin">${p.coin}</td>
            <td class="num">${fmtPx(p.entry_px)}</td>
            <td class="num">${fmtPx(mark)}</td>
            <td class="num ${sideClass(p.sz)}">${fmtPosU(p.sz, mark)}</td>
            <td class="num">${lev}</td>
            <td class="num ${up >= 0 ? 'pos' : 'neg'}">${fmtUsd(up)}</td>
        </tr>`;
    }).join('');
}

function fillRowsHtml(fills, showBot) {
    const cols = showBot ? 8 : 7;
    if (!fills.length) {
        return `<tr><td colspan="${cols}" class="text-text-muted">暂无成交</td></tr>`;
    }
    return fills.map((f) => {
        const ts = fmtBjTime(f.ts);
        const actRaw = String(f.action || '').replace(/^sync_/, '');
        const act = fillActLabel(f);
        const pos = fillPos(f);
        const isOpen = actRaw === 'open' || actRaw === 'increase';
        const isClose = actRaw === 'close' || actRaw === 'reduce' || actRaw === 'risk_halt_close';
        const rp = f.realized_pnl != null ? Number(f.realized_pnl) : null;
        const notion = f.notional != null ? Number(f.notional) : Math.abs(notionalU(f.our_sz, f.px) || 0);
        // 名义符号：开/加多 +、开/加空 −；平/减与仓位方向一致（平多 −、平空 +）
        const longish = pos === '多';
        const shortish = pos === '空';
        const exposeUp = isOpen ? longish : (isClose ? shortish : (f.side === 'buy'));
        const notionLabel = !notion
            ? '—'
            : (exposeUp ? '+' : '-') + '$' + Math.abs(notion).toLocaleString(undefined, { maximumFractionDigits: 0 });
        const lev = f.leverage != null ? Number(f.leverage).toFixed(1) + 'x' : '—';
        const pxTitle = isClose ? '平仓价' : (isOpen ? '开仓价' : '成交价');
        const pnlCell = isOpen
            ? '<span class="text-text-muted">—</span>'
            : `<span class="${rp == null ? '' : (rp >= 0 ? 'pos' : 'neg')}">${rp == null ? '—' : fmtUsd(rp)}</span>`;
        const actClass = longish ? 'pos' : (shortish ? 'neg' : '');
        const botCell = showBot ? `<td>${botLabel(f._bot)}</td>` : '';
        return `<tr>
            ${botCell}
            <td class="mono">${ts || '—'}</td>
            <td class="${actClass}">${act}</td>
            <td class="coin">${f.coin || '—'}</td>
            <td class="num" title="${pxTitle}">${fmtPx(f.px)}</td>
            <td class="num ${exposeUp ? 'pos' : 'neg'}">${notionLabel}</td>
            <td class="num">${lev}</td>
            <td class="num">${pnlCell}</td>
        </tr>`;
    }).join('');
}

function renderFillTabs(paper) {
    const bots = sortedBots(paper);
    const tabs = [{ id: 'all', label: '全部' }].concat(
        bots.map((b) => ({ id: b.id, label: botLabel(b.id) }))
    );
    const el = document.getElementById('fill-tabs');
    el.innerHTML = tabs.map((t) => (
        `<button type="button" class="fill-tab${t.id === fillFilter ? ' is-active' : ''}" data-filter="${t.id}">${t.label}</button>`
    )).join('');
}

function renderFills(paper) {
    const showBot = fillFilter === 'all';
    const fills = collectFills(paper, fillFilter);
    const table = document.getElementById('tbl-fills');
    table.classList.toggle('hide-bot', !showBot);

    document.getElementById('fills-cols').innerHTML = showBot
        ? '<col class="c-bot" /><col class="c-ts" /><col class="c-act" /><col class="c-coin" /><col class="c-px" /><col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />'
        : '<col class="c-ts" /><col class="c-act" /><col class="c-coin" /><col class="c-px" /><col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />';

    document.getElementById('fills-head').innerHTML = showBot
        ? '<th>策略</th><th>时间</th><th>动作</th><th>币</th><th class="num">价格</th><th class="num">名义(U)</th><th class="num">杠杆</th><th class="num">盈亏</th>'
        : '<th>时间</th><th>动作</th><th>币</th><th class="num">价格</th><th class="num">名义(U)</th><th class="num">杠杆</th><th class="num">盈亏</th>';

    document.getElementById('fills-tbody').innerHTML = fillRowsHtml(fills, showBot);
    const sub = document.getElementById('fills-sub');
    const cap = fillFilter === 'all' ? FILL_LIMIT_ALL : FILL_LIMIT;
    const who = fillFilter === 'all' ? '全部策略' : botLabel(fillFilter);
    sub.textContent = `${who} · 近 ${fills.length}/${cap} · 北京时间`;
}

function renderPaper(paper) {
    lastPaper = paper;
    const bots = sortedBots(paper);
    if (fillFilter !== 'all' && !bots.some((b) => b.id === fillFilter)) {
        fillFilter = 'all';
    }

    const strip = document.getElementById('bots-strip');
    strip.innerHTML = bots.map((b) => {
        const halted = b.risk_halted ? ' · 熔断' : '';
        const nested = botPositions(paper, b);
        const upnl2 = nested.reduce((s, p) => s + (Number(p.u_pnl) || 0), 0);
        const nPos = nested.length;
        const active = b.id === fillFilter ? ' is-active' : '';
        const initBal = b.paper_balance != null ? Number(b.paper_balance) : Number(b.balance);
        const balTag = Number.isFinite(initBal) ? ` · ${Math.round(initBal)}U` : '';
        const h = b.target_health || {};
        const healthCls = !h.status || h.status === 'ok'
            ? ''
            : (h.empty ? ' is-bad' : ' is-warn');
        let healthLine = '';
        if (h.status && h.status !== 'ok') {
            const bits = [h.label || h.status];
            if (h.target_av != null) bits.push(`对方AV $${Number(h.target_av).toLocaleString(undefined, { maximumFractionDigits: 0 })}`);
            if (h.quiet_hours != null) bits.push(`静默 ${Number(h.quiet_hours).toFixed(1)}h`);
            healthLine = `<div class="bot-health ${h.empty ? 'bad' : 'warn'}">${bits.join(' · ')}</div>`;
        }
        return `<button type="button" class="bot-card${active}${healthCls}" data-bot-id="${b.id}">
            <div class="bot-card-top">
                <div class="bot-card-name">${botLabel(b.id)}${halted}</div>
                <div class="bot-card-meta">${nPos} 仓${balTag}</div>
            </div>
            <div class="bot-stats">
                <div class="bot-stat">
                    <span class="stat-label">权益</span>
                    <span class="stat-value equity">${fmtUsd(b.equity)}</span>
                </div>
                <div class="bot-stat">
                    <span class="stat-label">浮盈</span>
                    <span class="stat-value ${upnl2 >= 0 ? 'pos' : 'neg'}">${fmtUsd(upnl2)}</span>
                </div>
                <div class="bot-stat">
                    <span class="stat-label">已实现</span>
                    <span class="stat-value">${fmtUsd(b.realized_pnl)}</span>
                </div>
            </div>
            ${healthLine}
        </button>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无策略</p>';

    document.getElementById('pos-by-strategy').innerHTML = bots.map((b) => {
        const positions = botPositions(paper, b);
        return `<div class="strategy-block">
            <div class="strategy-block-head">
                <div class="strategy-block-title">${botLabel(b.id)}</div>
                <div class="strategy-block-meta">${positions.length} 仓</div>
            </div>
            <div class="scroll-panel">
                <table class="data-table tbl-pos">
                    <colgroup>
                        <col class="c-coin" /><col class="c-entry" /><col class="c-mark" />
                        <col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />
                    </colgroup>
                    <thead><tr>
                        <th>币</th><th class="num">开仓价</th><th class="num">标记价</th>
                        <th class="num">仓位(U)</th><th class="num">杠杆</th><th class="num">浮盈</th>
                    </tr></thead>
                    <tbody>${posRowsHtml(positions)}</tbody>
                </table>
            </div>
        </div>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无仓位</p>';

    renderFillTabs(paper);
    renderFills(paper);
    syncActiveChrome();
    const { sub } = deskBalanceLine(bots);
    const subEl = document.getElementById('bots-sub');
    if (subEl && sub) subEl.textContent = sub;
}

function deskBalanceLine(bots) {
    const list = Array.isArray(bots) ? bots : [];
    const pairs = list.map((b) => {
        const v = b.paper_balance != null ? Number(b.paper_balance) : Number(b.balance);
        return {
            id: b.id,
            bal: Number.isFinite(v) ? Math.round(v) : null,
        };
    }).filter((x) => x.bal != null);
    if (!pairs.length) return { line: `${list.length} 策略`, sub: '按策略分列' };
    const uniq = [...new Set(pairs.map((p) => p.bal))];
    if (uniq.length === 1) {
        return {
            line: `${list.length} 策略 · 各 ${uniq[0]}U`,
            sub: `按策略分列 · 各 ${uniq[0]}U`,
        };
    }
    const parts = pairs.map((p) => `${botLabel(p.id).replace('策略 ', '')}${p.bal}U`);
    return {
        line: parts.join(' · '),
        sub: `按策略分列 · ${parts.join(' · ')}`,
    };
}

function renderCopyStatus(st) {
    const ws = document.getElementById('ws-badge');
    if (!st) {
        ws.textContent = 'WS —';
        return;
    }
    ws.textContent = st.running ? `WS 在线 · ${st.fills_seen || 0}` : 'WS 离线';
    const bots = (st.paper && st.paper.bots) || (lastPaper ? sortedBots(lastPaper) : []);
    const { line: balLine, sub } = deskBalanceLine(bots);
    let line = balLine;
    const alerts = [];
    for (const b of bots) {
        const h = b.target_health || {};
        if (h.status && h.status !== 'ok') {
            alerts.push(`${botLabel(b.id)}${h.label || h.status}`);
        }
    }
    const halted = bots.filter((b) => b.risk_halted);
    if (alerts.length) {
        line = `注意：${alerts.join(' · ')}`;
    } else if (halted.length) {
        line = `熔断：${halted.map((b) => botLabel(b.id)).join(', ')}`;
    }
    document.getElementById('status-line').textContent = line;
    const subEl = document.getElementById('bots-sub');
    if (subEl && sub) subEl.textContent = sub;
}

async function fetchPaper(mark) {
    const q = mark ? '?mark=true' : '';
    const res = await fetch(`${API}/api/hl-short/paper${q}`);
    if (!res.ok) throw new Error('paper ' + res.status);
    return res.json();
}

async function fetchCopyStatus() {
    const res = await fetch(`${API}/api/hl-short/copy/status`);
    if (!res.ok) throw new Error('copy ' + res.status);
    return res.json();
}

let pollTick = 0;

async function loadAll(refresh) {
    try {
        pollTick += 1;
        // Mark mids at most every 3rd poll (~45s) or on manual refresh
        const wantMark = !!refresh || (pollTick % 3 === 0);
        const [paper, st] = await Promise.all([
            fetchPaper(wantMark),
            fetchCopyStatus(),
        ]);
        renderPaper(paper);
        renderCopyStatus(st);
        setStatus(true, '已连接');
    } catch (err) {
        console.error(err);
        setStatus(false, '连接失败');
        document.getElementById('status-line').textContent = String(err.message || err);
    }
}

document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('btn-paper-reset').addEventListener('click', async () => {
    if (!confirm('重置模拟账本？')) return;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset`, { method: 'POST' });
        if (!res.ok) throw new Error('reset ' + res.status);
        await loadAll(false);
    } catch (err) {
        alert(String(err.message || err));
    }
});

document.getElementById('bots-strip').addEventListener('click', (e) => {
    const card = e.target.closest('.bot-card');
    if (!card) return;
    const id = card.dataset.botId;
    setFillFilter(fillFilter === id ? 'all' : id);
});

document.getElementById('fill-tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.fill-tab');
    if (!tab) return;
    setFillFilter(tab.dataset.filter);
});

loadAll(true);
pollTimer = setInterval(() => loadAll(false), 15000);
tickBjClock();
setInterval(tickBjClock, 1000);
</script>
