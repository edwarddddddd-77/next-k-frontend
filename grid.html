<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Next K · 网格</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <script src="api-base.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--text-primary);
      font-family: "Source Sans 3", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .bar {
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px; height: 52px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(16px);
      font-size: 13px;
    }
    .bar a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }
    .bar a:hover { color: var(--text-primary); background: color-mix(in srgb, var(--surface-light) 70%, transparent); }
    .bar strong {
      font-family: "Noto Serif SC", Georgia, serif;
      font-weight: 600; color: var(--text-primary);
    }
    .bar .hint { margin-left: auto; color: var(--text-muted); font-size: 12px; }
    .bar .open {
      color: var(--text-primary);
      border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
      padding: 5px 12px; border-radius: 999px; font-size: 12px;
      background: var(--surface);
    }
    .bar .open:hover { border-color: color-mix(in srgb, var(--gold) 30%, var(--border)); background: color-mix(in srgb, var(--gold-soft) 40%, var(--surface)); }
    iframe {
      width: 100%; height: calc(100% - 52px); border: 0; display: block;
      background: var(--bg);
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← 观盘台</a>
    <a href="hl-short.html">映仓台</a>
    <strong>Next K · 网格</strong>
    <span class="hint" id="hint">加载中…</span>
    <a class="open" id="openRaw" href="#" target="_blank" rel="noopener">新窗口打开</a>
  </div>
  <iframe id="frame" title="Next K 网格" src="about:blank"></iframe>
  <script>
    const base = (typeof resolveProtocolBase === 'function'
      ? resolveProtocolBase() : 'http://127.0.0.1:8001').replace(/\/$/, '');
    const url = base + '/';
    document.getElementById('hint').textContent = base;
    document.getElementById('openRaw').href = url;
    document.getElementById('frame').src = url;
  </script>
</body>
</html>
