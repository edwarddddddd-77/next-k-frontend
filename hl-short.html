<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next K · 映仓台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="api-base.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                        sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-light': 'var(--surface-light)',
                        border: 'var(--border)',
                        accent: 'var(--accent)',
                        gold: 'var(--gold)',
                        'neon-green': 'var(--neon-green)',
                        'neon-red': 'var(--neon-red)',
                        'neon-blue': 'var(--neon-blue)',
                        warn: 'var(--warn)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                    },
                },
            },
        };
    </script>
    <style>
        .focus-hero {
            border: 1px solid color-mix(in srgb, var(--gold) 28%, var(--border));
            border-radius: var(--radius-lg);
            background:
                radial-gradient(ellipse 80% 70% at 12% 0%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
                linear-gradient(165deg, color-mix(in srgb, var(--surface-light) 70%, var(--surface)) 0%, var(--surface) 100%);
            padding: 1.35rem 1.5rem;
        }
        .metric-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.55rem;
            border-radius: var(--radius-sm);
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            background: color-mix(in srgb, var(--surface-light) 40%, transparent);
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }
        .stat {
            min-width: 7rem;
        }
        .stat-label {
            font-size: 0.625rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .stat-value {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 1.35rem;
            line-height: 1.2;
            margin-top: 0.2rem;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .data-table thead th {
            padding: 0.5rem 0.55rem;
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .data-table tbody td {
            padding: 0.45rem 0.55rem;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
        }
        .pos { color: var(--neon-green); }
        .neg { color: var(--neon-red); }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.7rem; }
        .section-title {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 1rem;
            font-weight: 600;
        }
        .section-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }
    </style>
</head>
<body class="min-h-screen">
<header class="app-header sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-2.5">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <div class="flex items-center gap-2.5 shrink-0">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title text-text-primary">Next <span class="text-accent">K</span></h1>
                        <div class="brand-subtitle hidden sm:block">映仓台</div>
                    </div>
                </div>
                <nav class="hidden sm:flex items-center gap-1.5 ml-2">
                    <a class="nav-pill" href="index.html">观盘台</a>
                    <a class="nav-pill nav-pill-active" href="hl-short.html">映仓台</a>
                    <a class="nav-pill" href="grid.html">Next K 网格</a>
                </nav>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <span id="header-bj-clock" class="header-clock hidden sm:inline" title="北京时间">--:-- 北京</span>
                <button id="btn-refresh" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">刷新</button>
                <div id="connection-status" class="status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18">
                    <span class="status-dot"></span><span>连接中…</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="focus-hero" aria-label="策略桌面">
        <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
                <div class="panel-kicker">Paper · Hyperliquid</div>
                <h2 class="panel-title text-xl mt-1">纸面策略桌面</h2>
                <p id="status-line" class="panel-sub mt-1">载入中…</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <span id="ws-badge" class="metric-chip">WS —</span>
                <button id="btn-paper-reset" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">重置</button>
            </div>
        </div>
        <div id="bots-strip" class="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <section aria-label="仓位">
        <h3 class="section-title">策略仓位</h3>
        <p class="section-sub">各投 1000U · 独立账本</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-paper-pos">
                <thead>
                    <tr><th>策略</th><th>币</th><th>仓位(U)</th><th>杠杆</th><th>浮盈</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section aria-label="记录">
        <h3 class="section-title">成交记录</h3>
        <p class="section-sub">开平日志 · 北京时间</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-paper-fills">
                <thead>
                    <tr><th>时间(北京)</th><th>策略</th><th>动作</th><th>币</th><th>名义(U)</th><th>杠杆</th><th>盈亏</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section aria-label="策略">
        <h3 class="section-title">策略列表</h3>
        <p class="section-sub">纸面运行单元</p>
        <div class="mt-3 overflow-x-auto">
            <table class="data-table" id="tbl-targets">
                <thead>
                    <tr><th>策略</th><th>状态</th><th>纸面权益</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>

<script>
const API = resolveApiBase();
let pollTimer = null;

function setStatus(ok, text) {
    const el = document.getElementById('connection-status');
    el.className = ok
        ? 'status-pill status-pill-ok bg-neon-green/[0.07] text-neon-green border-neon-green/18'
        : 'status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18';
    el.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
}

function fmtUsd(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    const abs = Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + abs;
}

function fmtBjTime(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(0, 19);
        return new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(d);
    } catch (e) {
        return String(iso).slice(0, 19);
    }
}

function tickBjClock() {
    const el = document.getElementById('header-bj-clock');
    if (!el) return;
    try {
        const now = new Date();
        const t = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(now);
        el.textContent = t + ' 北京';
    } catch (e) {
        el.textContent = '--:-- 北京';
    }
}

function sideClass(szi) {
    const n = Number(szi);
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return '';
}

function notionalU(sz, px) {
    const s = Number(sz);
    const p = Number(px);
    if (!Number.isFinite(s) || !Number.isFinite(p) || p <= 0) return null;
    return s * p;
}

function fmtPosU(sz, px) {
    const n = notionalU(sz, px);
    if (n == null) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function botLabel(id) {
    const map = {
        wr94_hype: '策略 A',
        wr72_multi: '策略 B',
        wr88_btc_ada: '策略 C',
        wr63_alts: '策略 D',
        wr75_btc_eth: '策略 E',
    };
    return map[id] || id || '策略';
}

function renderPaper(paper) {
    const bots = Object.values(paper.bots || {});
    const strip = document.getElementById('bots-strip');
    strip.innerHTML = bots.map((b) => {
        const halted = b.risk_halted ? ' · 熔断' : '';
        const nested = b.positions && typeof b.positions === 'object' && !Array.isArray(b.positions)
            ? Object.values(b.positions)
            : [];
        const upnl2 = nested.length
            ? nested.reduce((s, p) => s + (Number(p.u_pnl) || 0), 0)
            : (Object.values(paper.positions || {}).filter((p) => p.source === b.id)
                .reduce((s, p) => s + (Number(p.u_pnl) || 0), 0));
        const nPos = nested.length
            || Object.values(paper.positions || {}).filter((p) => p.source === b.id).length;
        return `<div class="rounded border border-border bg-surface/80 p-3">
            <div class="flex justify-between gap-2 items-start">
                <div>
                    <div class="font-serif text-base">${botLabel(b.id)}${halted}</div>
                    <div class="text-text-muted text-xs mt-0.5">${nPos} 个持仓</div>
                </div>
                <span class="metric-chip">纸面</span>
            </div>
            <div class="mt-3 flex flex-wrap gap-5">
                <div class="stat"><div class="stat-label">权益</div><div class="stat-value text-lg">${fmtUsd(b.equity)}</div></div>
                <div class="stat"><div class="stat-label">浮盈</div><div class="stat-value text-lg ${upnl2 >= 0 ? 'pos' : 'neg'}">${fmtUsd(upnl2)}</div></div>
                <div class="stat"><div class="stat-label">已实现</div><div class="stat-value text-lg">${fmtUsd(b.realized_pnl)}</div></div>
            </div>
        </div>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无策略</p>';

    const positions = Object.values(paper.positions || {});
    document.querySelector('#tbl-paper-pos tbody').innerHTML = positions.map((p) => {
        const mark = p.mark_px != null ? p.mark_px : p.entry_px;
        const up = Number(p.u_pnl);
        const lev = p.leverage != null ? Number(p.leverage).toFixed(1) + 'x' : '—';
        return `<tr>
            <td>${botLabel(p.source)}</td>
            <td class="font-medium">${p.coin}</td>
            <td class="${sideClass(p.sz)}">${fmtPosU(p.sz, mark)}</td>
            <td>${lev}</td>
            <td class="${up >= 0 ? 'pos' : 'neg'}">${fmtUsd(up)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" class="text-text-muted">暂无持仓</td></tr>';

    const REAL = new Set(['open', 'close', 'reduce', 'increase', 'risk_halt_close', 'flip']);
    const fills = (paper.fills || []).filter((f) => {
        if (f.skipped) return false;
        const act = String(f.action || '').replace(/^sync_/, '');
        return REAL.has(act);
    }).slice(0, 30);
    document.querySelector('#tbl-paper-fills tbody').innerHTML = fills.map((f) => {
        const ts = fmtBjTime(f.ts);
        const act = String(f.action || '').replace(/^sync_/, '');
        const isOpen = act === 'open' || act === 'increase';
        const rp = f.realized_pnl != null ? Number(f.realized_pnl) : null;
        const notion = f.notional != null ? Number(f.notional) : Math.abs(notionalU(f.our_sz, f.px) || 0);
        const sell = f.side === 'sell' || act === 'close' || act === 'reduce';
        const notionLabel = !notion
            ? '—'
            : (sell ? '-' : '+') + '$' + Math.abs(notion).toLocaleString(undefined, { maximumFractionDigits: 0 });
        const lev = f.leverage != null ? Number(f.leverage).toFixed(1) + 'x' : '—';
        const pnlCell = isOpen
            ? '<span class="text-text-muted">—</span>'
            : `<span class="${rp == null ? '' : (rp >= 0 ? 'pos' : 'neg')}">${rp == null ? '—' : fmtUsd(rp)}</span>`;
        return `<tr>
            <td class="mono">${ts || '—'}</td>
            <td>${botLabel(f.source)}</td>
            <td>${act || f.side || '—'}</td>
            <td>${f.coin || '—'}</td>
            <td class="${sell ? 'neg' : 'pos'}">${notionLabel}</td>
            <td>${lev}</td>
            <td>${pnlCell}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="7" class="text-text-muted">暂无成交</td></tr>';
}

function renderTargets(board, paper) {
    const wallets = board.wallets || [];
    const bots = (paper && paper.bots) || {};
    document.querySelector('#tbl-targets tbody').innerHTML = wallets.map((row) => {
        const m = row.meta || {};
        const bid = m.id;
        const bot = bots[bid] || Object.values(bots).find((b) => b.id === bid) || {};
        const nPos = Object.keys(bot.positions || {}).length;
        const live = nPos > 0 ? '持仓中' : '待命';
        return `<tr>
            <td class="font-medium">${botLabel(bid)}</td>
            <td>${live}</td>
            <td>${fmtUsd(bot.equity != null ? bot.equity : 1000)}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="3" class="text-text-muted">无策略</td></tr>';
}

function renderCopyStatus(st) {
    const ws = document.getElementById('ws-badge');
    if (!st) {
        ws.textContent = 'WS —';
        return;
    }
    ws.textContent = st.running ? `WS 在线 · ${st.fills_seen || 0}` : 'WS 离线';
    const n = (st.paper && st.paper.bot_count) || ((st.paper && st.paper.bots) || []).length || 0;
    let line = `${n} 个纸面策略 · 各 1000U`;
    const halted = ((st.paper && st.paper.bots) || []).filter((b) => b.risk_halted);
    if (halted.length) {
        line = `风控熔断：${halted.map((b) => botLabel(b.id)).join(', ')}`;
    }
    document.getElementById('status-line').textContent = line;
}

async function fetchBoard(refresh) {
    const res = await fetch(`${API}/api/hl-short/board${refresh ? '?refresh=true' : ''}`);
    if (!res.ok) throw new Error('board ' + res.status);
    return res.json();
}

async function fetchPaper(mark) {
    const q = mark ? '?mark=true' : '';
    const res = await fetch(`${API}/api/hl-short/paper${q}`);
    if (!res.ok) throw new Error('paper ' + res.status);
    return res.json();
}

async function fetchCopyStatus() {
    const res = await fetch(`${API}/api/hl-short/copy/status`);
    if (!res.ok) throw new Error('copy ' + res.status);
    return res.json();
}

let pollTick = 0;

async function loadAll(refresh) {
    try {
        pollTick += 1;
        // Mark mids at most every 3rd poll (~45s) or on manual refresh
        const wantMark = !!refresh || (pollTick % 3 === 0);
        const [board, paper, st] = await Promise.all([
            fetchBoard(!!refresh),
            fetchPaper(wantMark),
            fetchCopyStatus(),
        ]);
        renderPaper(paper);
        renderTargets(board, paper);
        renderCopyStatus(st);
        setStatus(true, '已连接');
    } catch (err) {
        console.error(err);
        setStatus(false, '连接失败');
        document.getElementById('status-line').textContent = String(err.message || err);
    }
}

document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('btn-paper-reset').addEventListener('click', async () => {
    if (!confirm('重置模拟账本？')) return;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset`, { method: 'POST' });
        if (!res.ok) throw new Error('reset ' + res.status);
        await loadAll(false);
    } catch (err) {
        alert(String(err.message || err));
    }
});

loadAll(true);
pollTimer = setInterval(() => loadAll(false), 15000);
tickBjClock();
setInterval(tickBjClock, 1000);
</script>
</body>
</html>
