<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next K · 映仓台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="api-base.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                        sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-light': 'var(--surface-light)',
                        border: 'var(--border)',
                        accent: 'var(--accent)',
                        gold: 'var(--gold)',
                        'neon-green': 'var(--neon-green)',
                        'neon-red': 'var(--neon-red)',
                        'neon-blue': 'var(--neon-blue)',
                        warn: 'var(--warn)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                    },
                },
            },
        };
    </script>
    <style>
        .desk-main { max-width: 72rem; margin: 0 auto; padding: 0.65rem 1rem 1.25rem; }
        .desk-stack { display: flex; flex-direction: column; gap: 0.7rem; }
        .focus-hero {
            border: 1px solid color-mix(in srgb, var(--gold) 22%, var(--border));
            border-radius: var(--radius-lg);
            background:
                radial-gradient(ellipse 70% 80% at 0% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 50%),
                linear-gradient(165deg, color-mix(in srgb, var(--surface-light) 55%, var(--surface)) 0%, var(--surface) 100%);
            padding: 0.85rem 1rem;
        }
        .hero-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
        }
        .panel-kicker { font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
        .panel-title { font-family: "Noto Serif SC", Georgia, serif; font-size: 1.15rem; font-weight: 600; line-height: 1.25; margin-top: 0.1rem; }
        .panel-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.15rem; }
        .metric-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.45rem;
            border-radius: var(--radius-sm);
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            background: color-mix(in srgb, var(--surface-light) 40%, transparent);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            line-height: 1.2;
        }
        .bot-card {
            border: 1px solid color-mix(in srgb, var(--border) 85%, transparent);
            border-radius: var(--radius-md);
            background: color-mix(in srgb, var(--surface) 92%, var(--surface-light));
            padding: 0.55rem 0.7rem;
        }
        .bot-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .bot-card-name { font-family: "Noto Serif SC", Georgia, serif; font-size: 0.9rem; font-weight: 600; }
        .bot-card-meta { font-size: 0.65rem; color: var(--text-muted); }
        .bot-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.35rem 0.5rem;
        }
        .stat-label {
            font-size: 0.58rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .stat-value {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 0.95rem;
            line-height: 1.15;
            margin-top: 0.05rem;
            font-variant-numeric: tabular-nums;
        }
        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.45rem;
        }
        .section-title {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 0.92rem;
            font-weight: 600;
        }
        .section-sub { font-size: 0.7rem; color: var(--text-muted); }
        .block-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }
        @media (min-width: 720px) {
            .block-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (min-width: 1100px) {
            .block-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (min-width: 1400px) {
            .desk-main { max-width: 84rem; }
            .block-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        .strategy-block {
            border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
            border-radius: var(--radius-md);
            background: var(--surface);
            padding: 0.4rem 0.45rem 0.3rem;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .strategy-block-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.4rem;
            padding: 0 0.1rem;
        }
        .strategy-block-title {
            font-family: "Noto Serif SC", Georgia, serif;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .strategy-block-meta { font-size: 0.62rem; color: var(--text-muted); }
        .panel-label {
            font-size: 0.58rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 0.1rem 0.15rem;
        }
        .scroll-panel {
            max-height: 9.5rem;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
        }
        .scroll-panel.fills { max-height: 10.5rem; }
        .scroll-panel .data-table thead th {
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; table-layout: fixed; }
        .data-table thead th {
            padding: 0.35rem 0.4rem;
            font-size: 0.58rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .data-table tbody td {
            padding: 0.32rem 0.4rem;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .data-table .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.68rem;
        }
        .data-table thead th.num { text-align: right; }
        .data-table .coin { font-weight: 500; }
        .tbl-pos col.c-coin { width: 18%; }
        .tbl-pos col.c-sz { width: 34%; }
        .tbl-pos col.c-lev { width: 18%; }
        .tbl-pos col.c-pnl { width: 30%; }
        .tbl-fills col.c-ts { width: 18%; }
        .tbl-fills col.c-act { width: 16%; }
        .tbl-fills col.c-coin { width: 14%; }
        .tbl-fills col.c-sz { width: 22%; }
        .tbl-fills col.c-lev { width: 12%; }
        .tbl-fills col.c-pnl { width: 18%; }
        .pos { color: var(--neon-green); }
        .neg { color: var(--neon-red); }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.68rem; font-variant-numeric: tabular-nums; }
        #bots-strip {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem;
            margin-top: 0.7rem;
        }
        @media (min-width: 900px) {
            #bots-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        @media (min-width: 640px) and (max-width: 899px) {
            #bots-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
    </style>
</head>
<body class="min-h-screen">
<header class="app-header sticky top-0 z-50">
    <div class="desk-main" style="padding-top:0.55rem;padding-bottom:0.55rem;">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="flex items-center gap-2 shrink-0">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="brand-title text-text-primary">Next <span class="text-accent">K</span></h1>
                        <div class="brand-subtitle hidden sm:block">映仓台</div>
                    </div>
                </div>
                <nav class="hidden sm:flex items-center gap-1 ml-1">
                    <a class="nav-pill" href="index.html">观盘台</a>
                    <a class="nav-pill nav-pill-active" href="hl-short.html">映仓台</a>
                    <a class="nav-pill" href="grid.html">Next K 网格</a>
                </nav>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <span id="header-bj-clock" class="header-clock hidden sm:inline" title="北京时间">--:-- 北京</span>
                <button id="btn-refresh" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">刷新</button>
                <div id="connection-status" class="status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18">
                    <span class="status-dot"></span><span>连接中…</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="desk-main desk-stack">
    <section class="focus-hero" aria-label="策略桌面">
        <div class="hero-top">
            <div>
                <div class="panel-kicker">Paper · Hyperliquid</div>
                <h2 class="panel-title">纸面策略桌面</h2>
                <p id="status-line" class="panel-sub">载入中…</p>
            </div>
            <div class="flex flex-wrap gap-1.5 items-center">
                <span id="ws-badge" class="metric-chip">WS —</span>
                <button id="btn-paper-reset" type="button" class="metric-chip hover:border-gold/40 cursor-pointer">重置</button>
            </div>
        </div>
        <div id="bots-strip"></div>
    </section>

    <section aria-label="策略明细">
        <div class="section-head">
            <h3 class="section-title">策略明细</h3>
            <p class="section-sub">仓位 + 成交 · 各最多 20 条</p>
        </div>
        <div id="strategy-desk" class="block-grid"></div>
    </section>
</main>

<script>
const API = resolveApiBase();
let pollTimer = null;

function setStatus(ok, text) {
    const el = document.getElementById('connection-status');
    el.className = ok
        ? 'status-pill status-pill-ok bg-neon-green/[0.07] text-neon-green border-neon-green/18'
        : 'status-pill status-pill-err bg-neon-red/[0.07] text-neon-red border-neon-red/18';
    el.innerHTML = `<span class="status-dot"></span><span>${text}</span>`;
}

function fmtUsd(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    const abs = Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
    return (v < 0 ? '-$' : '$') + abs;
}

function fmtBjTime(iso) {
    if (!iso) return '—';
    try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(0, 19);
        return new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(d);
    } catch (e) {
        return String(iso).slice(0, 19);
    }
}

function tickBjClock() {
    const el = document.getElementById('header-bj-clock');
    if (!el) return;
    try {
        const now = new Date();
        const t = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
        }).format(now);
        el.textContent = t + ' 北京';
    } catch (e) {
        el.textContent = '--:-- 北京';
    }
}

function sideClass(szi) {
    const n = Number(szi);
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return '';
}

function notionalU(sz, px) {
    const s = Number(sz);
    const p = Number(px);
    if (!Number.isFinite(s) || !Number.isFinite(p) || p <= 0) return null;
    return s * p;
}

function fmtPosU(sz, px) {
    const n = notionalU(sz, px);
    if (n == null) return '—';
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + '$' + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function botLabel(id) {
    const map = {
        wr94_hype: '策略 A',
        wr72_multi: '策略 B',
        wr88_btc_ada: '策略 C',
        wr63_alts: '策略 D',
        wr75_btc_eth: '策略 E',
    };
    return map[id] || id || '策略';
}

const BOT_ORDER = ['wr94_hype', 'wr72_multi', 'wr88_btc_ada', 'wr63_alts', 'wr75_btc_eth'];
const FILL_REAL = new Set(['open', 'close', 'reduce', 'increase', 'risk_halt_close', 'flip']);
const FILL_LIMIT = 20;

function sortedBots(paper) {
    const bots = Object.values(paper.bots || {});
    return bots.sort((a, b) => {
        const ia = BOT_ORDER.indexOf(a.id);
        const ib = BOT_ORDER.indexOf(b.id);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
}

function botPositions(paper, bot) {
    const nested = bot.positions && typeof bot.positions === 'object' && !Array.isArray(bot.positions)
        ? Object.values(bot.positions)
        : [];
    if (nested.length) return nested;
    return Object.values(paper.positions || {}).filter((p) => p.source === bot.id);
}

function botFills(paper, bot) {
    const local = Array.isArray(bot.fills) ? bot.fills : [];
    const fromAgg = (paper.fills || []).filter((f) => f.source === bot.id);
    const pool = local.length ? local : fromAgg;
    return pool.filter((f) => {
        if (f.skipped) return false;
        const act = String(f.action || '').replace(/^sync_/, '');
        return FILL_REAL.has(act);
    }).slice(0, FILL_LIMIT);
}

function posRowsHtml(positions) {
    if (!positions.length) {
        return '<tr><td colspan="4" class="text-text-muted">空仓</td></tr>';
    }
    return positions.map((p) => {
        const mark = p.mark_px != null ? p.mark_px : p.entry_px;
        const up = Number(p.u_pnl);
        const lev = p.leverage != null ? Number(p.leverage).toFixed(1) + 'x' : '—';
        return `<tr>
            <td class="coin">${p.coin}</td>
            <td class="num ${sideClass(p.sz)}">${fmtPosU(p.sz, mark)}</td>
            <td class="num">${lev}</td>
            <td class="num ${up >= 0 ? 'pos' : 'neg'}">${fmtUsd(up)}</td>
        </tr>`;
    }).join('');
}

function fillRowsHtml(fills) {
    if (!fills.length) {
        return '<tr><td colspan="6" class="text-text-muted">暂无成交</td></tr>';
    }
    return fills.map((f) => {
        const ts = fmtBjTime(f.ts);
        const act = String(f.action || '').replace(/^sync_/, '');
        const isOpen = act === 'open' || act === 'increase';
        const rp = f.realized_pnl != null ? Number(f.realized_pnl) : null;
        const notion = f.notional != null ? Number(f.notional) : Math.abs(notionalU(f.our_sz, f.px) || 0);
        const sell = f.side === 'sell' || act === 'close' || act === 'reduce';
        const notionLabel = !notion
            ? '—'
            : (sell ? '-' : '+') + '$' + Math.abs(notion).toLocaleString(undefined, { maximumFractionDigits: 0 });
        const lev = f.leverage != null ? Number(f.leverage).toFixed(1) + 'x' : '—';
        const pnlCell = isOpen
            ? '<span class="text-text-muted">—</span>'
            : `<span class="${rp == null ? '' : (rp >= 0 ? 'pos' : 'neg')}">${rp == null ? '—' : fmtUsd(rp)}</span>`;
        return `<tr>
            <td class="mono">${ts || '—'}</td>
            <td>${act || f.side || '—'}</td>
            <td class="coin">${f.coin || '—'}</td>
            <td class="num ${sell ? 'neg' : 'pos'}">${notionLabel}</td>
            <td class="num">${lev}</td>
            <td class="num">${pnlCell}</td>
        </tr>`;
    }).join('');
}

function renderPaper(paper) {
    const bots = sortedBots(paper);
    const strip = document.getElementById('bots-strip');
    strip.innerHTML = bots.map((b) => {
        const halted = b.risk_halted ? ' · 熔断' : '';
        const nested = botPositions(paper, b);
        const upnl2 = nested.reduce((s, p) => s + (Number(p.u_pnl) || 0), 0);
        const nPos = nested.length;
        return `<div class="bot-card">
            <div class="bot-card-top">
                <div>
                    <div class="bot-card-name">${botLabel(b.id)}${halted}</div>
                    <div class="bot-card-meta">${nPos} 仓</div>
                </div>
            </div>
            <div class="bot-stats">
                <div><div class="stat-label">权益</div><div class="stat-value">${fmtUsd(b.equity)}</div></div>
                <div><div class="stat-label">浮盈</div><div class="stat-value ${upnl2 >= 0 ? 'pos' : 'neg'}">${fmtUsd(upnl2)}</div></div>
                <div><div class="stat-label">已实现</div><div class="stat-value">${fmtUsd(b.realized_pnl)}</div></div>
            </div>
        </div>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无策略</p>';

    document.getElementById('strategy-desk').innerHTML = bots.map((b) => {
        const positions = botPositions(paper, b);
        const fills = botFills(paper, b);
        return `<div class="strategy-block">
            <div class="strategy-block-head">
                <div class="strategy-block-title">${botLabel(b.id)}</div>
                <div class="strategy-block-meta">${positions.length} 仓 · ${fills.length} 笔</div>
            </div>
            <div>
                <div class="panel-label">仓位</div>
                <div class="scroll-panel">
                    <table class="data-table tbl-pos">
                        <colgroup>
                            <col class="c-coin" /><col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />
                        </colgroup>
                        <thead><tr>
                            <th>币</th><th class="num">仓位(U)</th><th class="num">杠杆</th><th class="num">浮盈</th>
                        </tr></thead>
                        <tbody>${posRowsHtml(positions)}</tbody>
                    </table>
                </div>
            </div>
            <div>
                <div class="panel-label">成交</div>
                <div class="scroll-panel fills">
                    <table class="data-table tbl-fills">
                        <colgroup>
                            <col class="c-ts" /><col class="c-act" /><col class="c-coin" />
                            <col class="c-sz" /><col class="c-lev" /><col class="c-pnl" />
                        </colgroup>
                        <thead><tr>
                            <th>时间</th><th>动作</th><th>币</th>
                            <th class="num">名义</th><th class="num">杠杆</th><th class="num">盈亏</th>
                        </tr></thead>
                        <tbody>${fillRowsHtml(fills)}</tbody>
                    </table>
                </div>
            </div>
        </div>`;
    }).join('') || '<p class="text-text-muted text-sm">暂无策略</p>';
}

function renderCopyStatus(st) {
    const ws = document.getElementById('ws-badge');
    if (!st) {
        ws.textContent = 'WS —';
        return;
    }
    ws.textContent = st.running ? `WS 在线 · ${st.fills_seen || 0}` : 'WS 离线';
    const n = (st.paper && st.paper.bot_count) || ((st.paper && st.paper.bots) || []).length || 0;
    let line = `${n} 策略 · 各 1000U`;
    const halted = ((st.paper && st.paper.bots) || []).filter((b) => b.risk_halted);
    if (halted.length) {
        line = `熔断：${halted.map((b) => botLabel(b.id)).join(', ')}`;
    }
    document.getElementById('status-line').textContent = line;
}

async function fetchPaper(mark) {
    const q = mark ? '?mark=true' : '';
    const res = await fetch(`${API}/api/hl-short/paper${q}`);
    if (!res.ok) throw new Error('paper ' + res.status);
    return res.json();
}

async function fetchCopyStatus() {
    const res = await fetch(`${API}/api/hl-short/copy/status`);
    if (!res.ok) throw new Error('copy ' + res.status);
    return res.json();
}

let pollTick = 0;

async function loadAll(refresh) {
    try {
        pollTick += 1;
        // Mark mids at most every 3rd poll (~45s) or on manual refresh
        const wantMark = !!refresh || (pollTick % 3 === 0);
        const [paper, st] = await Promise.all([
            fetchPaper(wantMark),
            fetchCopyStatus(),
        ]);
        renderPaper(paper);
        renderCopyStatus(st);
        setStatus(true, '已连接');
    } catch (err) {
        console.error(err);
        setStatus(false, '连接失败');
        document.getElementById('status-line').textContent = String(err.message || err);
    }
}

document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));
document.getElementById('btn-paper-reset').addEventListener('click', async () => {
    if (!confirm('重置模拟账本？')) return;
    try {
        const res = await fetch(`${API}/api/hl-short/paper/reset`, { method: 'POST' });
        if (!res.ok) throw new Error('reset ' + res.status);
        await loadAll(false);
    } catch (err) {
        alert(String(err.message || err));
    }
});

loadAll(true);
